aid: pixepi
name: Pixepi
image: https://pixepi.com/og-image.png?app=core
description: Pixepi provides practical online tools for PDFs, images, text and more, allowing users to process files via HTTP APIs without installing
  software or signing up. The platform offers a range of utilities such as PDF conversion, image manipulation, and OCR, accessible through a bearer‑key
  secured REST API. It targets developers needing quick, free‑tier access to common document processing tasks.
